<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" />

  <!-- Graduation Cap Icon in White -->
  <g transform="translate(76, 96)" filter="url(#shadow)">
    <!-- Cap Diamond / Mortarboard -->
    <path d="M180 40 L340 120 L180 200 L20 120 Z" fill="#ffffff" />
    <!-- Cap Base / Skullcap -->
    <path d="M70 148 L70 230 C70 280, 290 280, 290 230 L290 148 C255 175, 218 190, 180 190 C142 190, 105 175, 70 148 Z" fill="#e2e8f0" />
    <!-- Tassel String & Bobble -->
    <path d="M300 140 L330 200 L330 270" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="330" cy="275" r="10" fill="#f59e0b" />
  </g>

  <!-- Subtitle Text "CRM" Badge -->
  <g transform="translate(196, 400)">
    <rect x="0" y="0" width="120" height="38" rx="19" fill="rgba(255, 255, 255, 0.25)" />
    <text x="60" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">CRM</text>
  </g>
</svg>
